[profiles.qwen35-2b-sft]
mode = "sft"
trainer = "qwen"
base_model = "unsloth/Qwen3.5-2B"
max_seq_length = 16384
lora_r = 32
lora_alpha = 64
# Variable-length 16K rows can spike activation memory late in an epoch on a
# 16 GB card. Keep effective batch 8 while making every individual row safe.
batch_size = 1
grad_accum = 8
eval_batch_size = 1
epochs = 1
learning_rate = 0.0002
warmup_steps = 10
eval_steps = 50
save_steps = 50
output_root = "training/canonical/qwen35-2b"
model_root = "models/canonical/Qwen3.5-2B-VoiceInk"

