[project]
name = "voiceink-llama-router"
version = "0.1.0"
description = "Private VoiceInk cleanup, labeling, training, and evaluation pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate==1.13.0",
  "bitsandbytes==0.49.2",
  "datasets==4.3.0",
  "mlflow==3.15.1",
  "nvidia-ml-py>=13.590.44",
  "peft==0.18.1",
  "torch==2.8.0",
  "transformers==5.2.0",
  "trl==0.22.2",
  "unsloth==2026.8.7",
  "xformers==0.0.32.post2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
